name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pakete-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Check Android manifest privacy baseline
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "app/src/main/AndroidManifest.xml"
          root = ET.parse(path).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None:
              raise SystemExit("Android manifest has no application element")
          if app.attrib.get(android + "allowBackup", "true").lower() != "false":
              raise SystemExit("allowBackup must be explicitly false")
          if app.attrib.get(android + "usesCleartextTraffic", "false").lower() == "true":
              raise SystemExit("Cleartext traffic must not be enabled")
          if any(node.attrib.get(android + "name") == "android.permission.INTERNET"
                 for node in root.findall("uses-permission")):
              raise SystemExit("This manual-only prototype must not request INTERNET")
          print("Manifest privacy baseline passed.")
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pakete-manual-tracking-prototype-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
